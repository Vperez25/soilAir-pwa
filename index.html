<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoilAir · Catálogo de cultivos</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />

    <!--
      Raíz del sitio. Tiene que ir ANTES de las hojas de estilo y del módulo,
      porque fija desde dónde se resuelven las rutas relativas del documento.

      Sin esto, un enlace directo a /soilAir-pwa/cultivo/maiz (que GitHub Pages
      atiende con 404.html) buscaría el script en .../cultivo/src/main.js.

      El nombre del repositorio debe coincidir con REPO en src/config.js.
    -->
    <script>
      (function () {
        var REPO = "soilAir-pwa";
        var enPages =
          location.pathname === "/" + REPO ||
          location.pathname.indexOf("/" + REPO + "/") === 0;
        var etiqueta = document.createElement("base");
        etiqueta.href = enPages ? "/" + REPO + "/" : "/";
        document.head.appendChild(etiqueta);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/shell.css" />
    <link rel="stylesheet" href="styles/views.css" />
    <link rel="stylesheet" href="styles/cultivosView.css" />
    <link rel="stylesheet" href="styles/climaView.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="marca" href="/" data-link>
        <span class="marca__hoja" aria-hidden="true"></span>
        <span class="marca__texto">SoilAir</span>
      </a>

      <nav class="nav" aria-label="Navegación principal">
        <a href="/" data-link>Cultivos</a>
        <a href="/clima" data-link>Clima</a>
        <a href="/acerca" data-link>Acerca</a>
      </nav>
    </header>

    <main id="app" class="contenido" aria-live="polite">
      <!-- El router monta aquí cada vista -->

      <!-- Skeleton -->
      <article class="tarjeta">
        <p class="tarjeta__familia">█████████████</p>
        <h2 class="tarjeta__nombre">██████████████████</h2>
        <p class="tarjeta__cientifico">████████████████</p>
        <p class="tarjeta__resumen">████████████████</p>

        <dl class="tarjeta__datos">
          <div>
            <dt>█████</dt>
            <dd>████████ █████</dd>
          </div>
          <div>
            <dt>██████████</dt>
            <dd><code>██████</code></dd>
          </div>
        </dl>

        <a class="tarjeta__enlace" data-link> █████████████████████ </a>
      </article>
    </main>

    <footer class="pie">
      <p>SoilAir — monitoreo de suelo y aire para agricultura de precisión.</p>
      <p class="pie_nota">
        Unidad 1, Ejercicio 5 · Consumo de API REST con fetch
      </p>
    </footer>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
